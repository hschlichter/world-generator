# Eldermark: a 10 km x 10 km (100 km2) medieval fantasy march for streaming / LOD tests.
#
# Every value here is a generator parameter. Changing a value and regenerating the affected cells is all
# that is needed; nothing in the generator hard-codes these. Distances are metres, the world is Z-up and
# centred on the origin, x points east, y points north.

[world]
name = "Eldermark"
seed = 1337
size = 10000.0                # square edge length; the world spans [-size/2, size/2] in x and y
output_dir = "world"
cache_dir = "build/cache"     # deterministic intermediate data (heightfield, decimated meshes)

# Regions generated by `generate` when no --regions argument is given. "all" or a list of cell names.
generate_regions = ["R_4_5"]           # Elderford; "all" for the whole march

# ---------------------------------------------------------------------------------------------------------------------
# Streaming partition. `levels` lists the cell levels, coarsest first; each level's size must divide the previous
# one. The hierarchy depth is len(levels). Each cell is a LOD root whose first level ("full") holds its child cells
# (or, for the finest cell level, the terrain at full resolution and every placed asset); the remaining levels are
# coarse stand-ins for the whole cell, finest first. Every content level is a payload of its own file; the full level
# of a non-finest cell is a payload or a reference (`full_arc`).
#
# Three heuristic domains per cell, all measured from the camera to the cell's bounding box:
#   imaging    distance_thresholds (+ blend, + screen-size equivalents): which level is drawn
#   streaming  streaming_distance_thresholds: the load radius of each level boundary (the level on the finer side
#              is loaded once the camera is inside it); streaming_unload_thresholds: the radius at which it is
#              released again (hysteresis). Load radius >= imaging threshold, so a level is resident before it
#              is drawn; the margin is the prefetch lead (lead time x camera speed).
#   physics    physics_distance_thresholds (finest cells): which level collision uses
# A child cell's thresholds (imaging and streaming unload) must lie inside its parent's first boundary.
# Each step between levels aims at a 3-5x drop in data, so every ring around the camera costs about the same.
# ---------------------------------------------------------------------------------------------------------------------
[partition]
default_level = "coarsest"    # "coarsest" or "finest": the lod:default:index of every cell root (see docs)

[[partition.levels]]
name = "region"
prefix = "R"
size = 1000.0
file_format_full = "usda"     # the region's full level only holds tile structure, so it stays human readable
full_arc = "reference"        # tile structure (~56 KB per region) is always composed: tiles stream on their own
# Coarse levels keep the placed assets as point instances of the asset's own LOD levels: each instance shows the level
# the asset itself would select at the distance where the coarse level takes over (its scale taken into account), so
# a switch changes the cell's terrain and drops small assets but never swaps a tree for a different shape. Filters:
# trees_min_height / bushes_min_height (metres, scaled height) and min_size (largest extent, every other asset).
coarse = [
  # Mid-distance stand-in: 5 m terrain with the near terrain material (same as tile `simplified`, so the 600 m switch
  # changes geometry density but not shading), every tree and the larger bushes and rocks.
  { name = "medium", terrain_quads = 200, terrain_material = "near", trees_min_height = 0.0, bushes_min_height = 1.0, min_size = 4.0 },
  # Far field: 10 m terrain with the far material, trees taller than 5 m, the largest rocks and every building.
  { name = "proxy", terrain_quads = 100, trees_min_height = 5.0, bushes_min_height = 99.0, min_size = 6.0, texture_size = 1024 },
]
# Distance from the camera to the cell's bounding box at which the root switches from level i to level i+1.
distance_thresholds = [600.0, 1200.0]
distance_blend = [680.0, 1300.0]
# Screen-size equivalents for engines that prefer a projected-size heuristic: the projected-sphere fraction of the
# view at which the switch happens at the distance thresholds above for the reference camera ([lod]); values above
# 1 are normal for a sphere around a 1 km cell seen from inside 600 m.
screen_thresholds = [1.107, 0.4674]
screen_blend = [0.9635, 0.4172]
streaming_distance_thresholds = [700.0, 1400.0]
streaming_unload_thresholds = [800.0, 1600.0]

[[partition.levels]]
name = "tile"
prefix = "T"
size = 250.0
coarse = [
  { name = "medium", terrain_quads = 125, trees_min_height = 0.0, bushes_min_height = 0.0, min_size = 1.5 },
  { name = "simplified", terrain_quads = 50, trees_min_height = 0.0, bushes_min_height = 0.6, min_size = 2.5 },
]
distance_thresholds = [220.0, 420.0]
distance_blend = [250.0, 460.0]
screen_thresholds = [0.7357, 0.3011]   # calibrated as for regions
screen_blend = [0.6255, 0.2620]
streaming_distance_thresholds = [300.0, 500.0]
streaming_unload_thresholds = [360.0, 580.0]
# Physics: collision uses the full-resolution terrain within 120 m, the medium terrain to 420 m, simplified beyond.
physics_distance_thresholds = [120.0, 420.0]

[terrain]
spacing = 1.0                 # finest sample spacing of the heightfield; a tile's full level samples every point
full_quads = 250              # quads per tile edge at the full level (tile size / spacing)
skirt_margin = 0.5            # extra skirt depth beyond the measured worst-case edge deviation
skirt_min = 1.0
base_height = 40.0
swell_height = 55.0           # amplitude of the km-scale swells and basins of the lowlands
erosion_spacing = 2.0         # grid spacing of the droplet-erosion pass
erosion_droplets_per_km2 = 280000   # droplet-erosion density (the pass runs window by window)
erosion_steps = 72
region_texture_size = 2048    # baked terrain colour per region (0.49 m per texel at the default region size)
detail_tiling = 6.0           # metres per repeat of the shared detail normal / roughness textures

# Ground LOD inside a tile's full level. The 1 m terrain is split into chunks of `chunk` metres; every chunk is a LOD
# root (a child of the tile's full level) with two levels:
#   fine  0.5 m mesh: Catmull-Rom interpolation of the heightfield plus synthesized micro-relief (clods and tussocks,
#         forest-floor hummocks, sharp rock detail, medieval ridge-and-furrow on the farm strips, trodden paths and
#         settlement ground), coloured by a per-tile texture sampled from the terrain source textures. Payload into the
#         tile's ground file (one file per tile, one payload per chunk).
#   base  the 1 m mesh, inline in the tile's full level (the default level; collision).
# Same three domains as the cells (imaging, streaming with hysteresis); the thresholds must lie inside the tile's
# first boundary.
[terrain.ground_lod]
chunk = 50.0                  # metres; must divide the finest cell size
fine_spacing = 0.5
fine_texture_size = 1024      # per tile (0.24 m per texel at the default tile size)
micro_relief = 1.0            # scale of the synthesized relief
distance_thresholds = [50.0]
distance_blend = [58.0]
streaming_distance_thresholds = [100.0]   # 50 m of prefetch: about 1.7 s at 30 m/s, the replay's worst queue delay
streaming_unload_thresholds = [120.0]

