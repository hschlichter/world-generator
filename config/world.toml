# ---------------------------------------------------------------------------------------------------------------------
# Density. Instance counts per hectare at density 1.0 in fully suitable terrain; the biome fields scale them down.
# `scale` multiplies everything. Presets: light ~0.15 (iteration), default 1.0, heavy ~2.5 (stress).
# ---------------------------------------------------------------------------------------------------------------------
[density]
scale = 1.0
trees_per_ha = 300.0          # forest (open woodland: stands with glades between them)
saplings_per_ha = 550.0
bushes_per_ha = 2600.0
rocks_per_ha = 400.0
logs_per_ha = 70.0
mountain_rocks_per_ha = 160.0
scatter_per_m2 = 2.6          # grass, flowers, ferns, pebbles (point instanced)
scatter_chunks = 2            # point instancers per tile edge (2 -> 4 instancers per tile) for culling granularity

[density.presets]
light = 0.15
default = 1.0
heavy = 2.5

# ---------------------------------------------------------------------------------------------------------------------
# Asset LOD. Screen-size thresholds (fraction of the view covered by the projected bounding sphere), descending,
# one fewer than the asset's level count. `reference_distances` documents where the switches happen for the
# reference camera below (computed into the manifest, not used by the heuristics).
# ---------------------------------------------------------------------------------------------------------------------
[lod]
reference_camera = { horizontal_aperture = 36.0, focal_length = 24.0, aspect = 1.7778 }
asset_default_level = "coarsest"

# Every asset has 8 levels (lod0..lod7), so each class has 7 screen thresholds. They step by roughly 2x in
# projected size (about 1.4x in distance), so each switch removes about half the detail; the blend band is the
# upper 15 % of each step. Physics (rocks, structures): physics_levels = [near, far] are the levels collision
# uses within / beyond physics_distance (metres); lod0 is never used for collision.
[lod.assets.tree]
screen_thresholds = [0.25, 0.121, 0.0585, 0.0283, 0.0137, 0.00662, 0.0032]
screen_blend = [0.212, 0.103, 0.0497, 0.0241, 0.0116, 0.00563, 0.00272]

[lod.assets.bush]
screen_thresholds = [0.12, 0.0578, 0.0278, 0.0134, 0.00646, 0.00311, 0.0015]
screen_blend = [0.102, 0.0491, 0.0236, 0.0114, 0.00549, 0.00264, 0.00128]

[lod.assets.rock]
screen_thresholds = [0.18, 0.085, 0.0402, 0.019, 0.00896, 0.00423, 0.002]
screen_blend = [0.153, 0.0723, 0.0342, 0.0161, 0.00762, 0.0036, 0.0017]
physics_levels = [3, 7]        # decimated (~600 tris) near, the coarsest hull far
physics_distance = 60.0

[lod.assets.log]
screen_thresholds = [0.09, 0.0438, 0.0213, 0.0104, 0.00506, 0.00246, 0.0012]
screen_blend = [0.0765, 0.0372, 0.0181, 0.00884, 0.0043, 0.00209, 0.00102]

[lod.assets.structure]
screen_thresholds = [0.4, 0.193, 0.0928, 0.0447, 0.0215, 0.0104, 0.005]
screen_blend = [0.34, 0.164, 0.0789, 0.038, 0.0183, 0.00884, 0.00425]
physics_levels = [4, 7]        # merged masonry near, the silhouette far
physics_distance = 80.0

# Buildings (houses, windmill, keep, gatehouse, the wizard's tower) hold their detail further out than the other
# structures: thresholds are 2.5x smaller, and since a screen size is an area fraction that is about 1.6x the distance.
# A house keeps its timber framing to about 120 m and reaches its silhouette at about 250 m (was 76 and 157 m).
[lod.assets.building]
screen_thresholds = [0.16, 0.0772, 0.0371, 0.0179, 0.0086, 0.00416, 0.002]
screen_blend = [0.136, 0.0656, 0.0316, 0.0152, 0.00732, 0.00354, 0.0017]
physics_levels = [4, 7]
physics_distance = 80.0

# The 8-level LOD test tree (generator/run.sh lodtree, world/assets/lodtest/). Thresholds step by about 2x in
# projected size, so each switch removes about half the detail; the blend band is the upper 15 % of each step.
[lod.lodtest]
screen_thresholds = [0.25, 0.12, 0.058, 0.028, 0.0135, 0.0065, 0.0032]
screen_blend = [0.2125, 0.102, 0.0493, 0.0238, 0.0115, 0.00553, 0.00272]

